<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8" />

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <style>
        :root {
            --marrom: #5B352D;
            --laranja: #E89507;
            --cinza: #E4E4E4;
            --cinza-escuro: #8A7B74;
            --amarelo-btn: #ea8501;
            --laranja-btn: #d13d00;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            background: #fff;
        }

        body {
            font-family: "Montserrat", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                "Helvetica Neue", Arial, sans-serif;
            color: var(--marrom);
            -webkit-text-size-adjust: 100%;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
        }

        /* ---------------- faixa do topo ---------------- */

        .faixa {
            display: block;
            width: 100%;
            height: auto;
        }

        .pagina {
            flex: 1;
            width: 100%;
            max-width: 470px;
            margin: 0 auto;
            padding: 0 5vw 2.5rem;
        }

        @media (min-width: 520px) {
            .pagina {
                padding-inline: 24px;
            }
        }

        .bem-vindo {
            display: block;
            width: 100%;
            height: auto;
            margin: .25rem auto 2rem;
        }

        /* ---------------- títulos de seção ---------------- */

        .secao {
            display: flex;
            align-items: center;
            gap: .7em;
            font-size: clamp(19px, 5.4vw, 26px);
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: -.5px;
            color: var(--marrom);
            margin-bottom: .9rem;
        }

        .secao::after {
            content: "";
            flex: 1;
            height: 3px;
            background: var(--marrom);
            border-radius: 2px;
        }

        .secao:not(:first-of-type) {
            margin-top: 2rem;
        }

        /* ---------------- linhas ---------------- */

        .lista {
            list-style: none;
        }

        .item {
            display: flex;
            align-items: stretch;
            gap: 4%;
            margin-bottom: 1rem;
        }

        .cartao {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            text-decoration: none;
            color: var(--marrom);
            background: var(--cinza);
            border-radius: 999px;
            padding: .7em 1em;
            min-height: 72px;
            transition: background .15s;
        }

        .cartao:hover,
        .cartao:active {
            background: #efefef;
        }

        .cartao strong {
            font-size: clamp(20px, 5.6vw, 27px);
            font-weight: 900;
            letter-spacing: -.5px;
            line-height: 1.05;
        }

        .cartao span {
            font-size: clamp(12px, 3.4vw, 16px);
            font-weight: 500;
            color: var(--cinza-escuro);
            line-height: 1.2;
        }

        /* linhas de vídeo: sem pílula, ícone + rótulo */
        .cartao-video {
            flex-direction: row;
            gap: 1em;
            background: none;
            border-radius: 14px;
            padding: .4em .6em;
            justify-content: flex-start;
        }

        .cartao-video:hover,
        .cartao-video:active {
            background: #f4f4f4;
        }

        .cartao-video img {
            flex: 0 0 auto;
            width: 30%;
            max-width: 92px;
            height: auto;
        }

        .cartao-video strong {
            font-size: clamp(17px, 4.8vw, 24px);
            text-transform: uppercase;
            text-align: left;
        }

        /* ---------------- botão de QR ---------------- */

        .btn-qr {
            flex: 0 0 21%;
            max-width: 84px;
            aspect-ratio: 1;
            border: 0;
            border-radius: 50%;
            background: var(--cinza);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            padding: 0;
            transition: background .15s;
        }

        .btn-qr:hover,
        .btn-qr:active {
            background: #efefef;
        }

        .btn-qr svg {
            width: 46%;
            height: auto;
            fill: #1a1a1a;
        }

        /* ---------------- informativos ---------------- */

        .informativos {
            list-style: none;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 4%;
            margin-top: .4rem;
        }

        .informativos li {
            flex: 1 1 0;
            display: flex;
            justify-content: center;
        }

        .informativos a {
            display: block;
            padding: .4rem;
            border-radius: 12px;
            transition: background .15s;
        }

        .informativos a:hover,
        .informativos a:active {
            background: #f4f4f4;
        }

        .informativos img {
            display: block;
            width: 100%;
            height: auto;
        }

        /* ---------------- sobreposição do QR ---------------- */

        .overlay-qr {
            position: fixed;
            inset: 0;
            z-index: 20;
            background: rgba(40, 25, 20, .55);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 6vw;
        }

        .overlay-qr[hidden] {
            display: none;
        }

        .painel-qr {
            background: #fff;
            border-radius: 18px;
            padding: 1.3rem 1.3rem 1.1rem;
            text-align: center;
            max-width: 320px;
            width: 100%;
            box-shadow: 0 12px 32px rgba(0, 0, 0, .3);
        }

        .painel-qr h3 {
            font-size: 16px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: -.3px;
            margin-bottom: .8rem;
            line-height: 1.2;
        }

        .painel-qr img {
            display: block;
            width: 100%;
            max-width: 230px;
            height: auto;
            margin: 0 auto;
            border-radius: 6px;
        }

        .painel-qr p {
            font-size: 13px;
            font-weight: 700;
            margin: .9rem 0 .5rem;
        }

        .baixar {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        .baixar a {
            flex: 1;
            max-width: 110px;
            padding: 11px 0;
            border-radius: 4px;
            background: linear-gradient(to bottom, var(--amarelo-btn), var(--laranja-btn));
            color: #fff;
            font-size: 15px;
            font-weight: 700;
            text-decoration: none;
        }

        .fechar-qr {
            display: block;
            width: 100%;
            margin-top: .9rem;
            padding: 6px;
            border: 0;
            background: none;
            font-family: inherit;
            font-size: 13px;
            font-weight: 700;
            color: var(--cinza-escuro);
            cursor: pointer;
            text-transform: uppercase;
        }
    </style>
</head>

    <div class="overlay-qr" id="overlay" hidden>
        <div class="painel-qr" role="dialog" aria-modal="true" aria-labelledby="qr-titulo">
            <h3 id="qr-titulo"></h3>
            <img id="qr-imagem" src="" alt="">
            <p>Baixar arquivos</p>
            <div class="baixar">
                <a id="qr-svg" href="" download>SVG</a>
                <a id="qr-png" href="" download>PNG</a>
            </div>
            <button class="fechar-qr" type="button" id="fechar">Fechar</button>
        </div>
    </div>

    <script>
        (function () {
            var overlay = document.getElementById('overlay');
            var titulo = document.getElementById('qr-titulo');
            var imagem = document.getElementById('qr-imagem');
            var linkSvg = document.getElementById('qr-svg');
            var linkPng = document.getElementById('qr-png');

            function abrir(id, nome) {
                var base = 'assets/QRCodes/QR-' + id;
                titulo.textContent = nome;
                imagem.src = base + '.svg';
                imagem.alt = 'QR Code — ' + nome;
                linkSvg.href = base + '.svg';
                linkPng.href = base + '.png';
                overlay.hidden = false;
            }

            function fechar() { overlay.hidden = true; }

            document.querySelectorAll('.btn-qr').forEach(function (b) {
                b.addEventListener('click', function () {
                    abrir(b.dataset.qr, b.dataset.titulo);
                });
            });

            document.getElementById('fechar').addEventListener('click', fechar);
            overlay.addEventListener('click', function (e) {
                if (e.target === overlay) fechar();
            });
            document.addEventListener('keydown', function (e) {
                if (e.key === 'Escape') fechar();
            });
        })();
    </script>
